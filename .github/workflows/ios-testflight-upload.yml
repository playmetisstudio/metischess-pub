name: iOS TestFlight Upload Only

# Retries only the export and upload of a TestFlight build whose archive succeeded but whose
# upload failed. ios-testflight.yml keeps that archive as DarkBoard.xcarchive.zip in the private
# release; this workflow downloads it and runs the same `xcodebuild -exportArchive` (destination
# upload) with the same App Store Connect key, so nothing is compiled again.
#
# metischess-client/tools/ios-build/retry-testflight-upload.ps1 starts it and waits.
# Secrets and the public-log rule are the same as ios-testflight.yml (see its header): the
# export output goes to xcodebuild-export.log in the private release.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release in metischess-client that holds DarkBoard.xcarchive.zip"
        required: true
        default: "ios-xcode-auto"

permissions: {}

env:
  CLIENT_REPO: playmetisstudio/metischess-client
  RELEASE_TAG: ${{ inputs.release_tag }}
  KEY_DIR: ${{ github.workspace }}/asc-key

jobs:
  upload:
    name: Export the kept archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check secrets
        env:
          CLIENT_REPO_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          MISSING=""
          for NAME in CLIENT_REPO_TOKEN ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!NAME}" ]; then MISSING="$MISSING $NAME"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Repository secrets not set:$MISSING (see the header of ios-testflight.yml)."
            exit 1
          fi

      - name: Download the kept archive
        env:
          GH_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          if ! gh release download "$RELEASE_TAG" --repo "$CLIENT_REPO" --pattern DarkBoard.xcarchive.zip; then
            echo "::error::No DarkBoard.xcarchive.zip in the release: the last ios-testflight.yml run did not keep one (it succeeded, its archive failed, or a newer run started). Run the full build."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$CLIENT_REPO" --json assets --jq '.assets[].name' | grep -qxF xcodebuild-export.log; then
            gh release delete-asset "$RELEASE_TAG" xcodebuild-export.log --repo "$CLIENT_REPO" --yes
          fi
          ditto -x -k DarkBoard.xcarchive.zip .
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' DarkBoard.xcarchive/Info.plist \
            | sed 's/^/Build number: /'

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this runner image; App Store Connect rejects older SDKs."
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Write the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          # Prints an App Store Connect API token (ES256 JWT, 15 min) for curl.
          cat > "$KEY_DIR/asc-token.sh" <<'EOF'
          set -euo pipefail
          b64url() { base64 | tr -d '\n=' | tr '+/' '-_'; }
          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$ASC_KEY_ID" | b64url)
          PAYLOAD=$(printf '{"iss":"%s","iat":%d,"exp":%d,"aud":"appstoreconnect-v1"}' \
            "$ASC_ISSUER_ID" "$NOW" $((NOW + 900)) | b64url)
          # openssl gives a DER signature; a JWT needs the raw 32-byte r and s, left-padded.
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" \
            | openssl dgst -sha256 -sign "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" \
            | openssl asn1parse -inform DER \
            | awk -F: '/INTEGER/ { printf "%064s", $NF }' | tr ' ' '0' \
            | xxd -r -p | b64url)
          printf '%s.%s.%s\n' "$HEADER" "$PAYLOAD" "$SIG"
          EOF

      # The export may make a development certificate on a fresh runner too: same list-before /
      # revoke-after pair as ios-testflight.yml.
      - name: List development certificates
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          TOKEN=$(bash "$KEY_DIR/asc-token.sh")
          if curl -sfg -H "Authorization: Bearer $TOKEN" \
              "https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=DEVELOPMENT,IOS_DEVELOPMENT&fields[certificates]=certificateType&limit=200" \
              | jq -r '.data[].id' | sort > "$RUNNER_TEMP/dev-certs-before.txt"; then
            echo "Development certificates before the export: $(wc -l < "$RUNNER_TEMP/dev-certs-before.txt" | tr -d ' ')"
          else
            rm -f "$RUNNER_TEMP/dev-certs-before.txt"
            echo "::warning::Could not list certificates; a development certificate made by this run will not be revoked."
          fi

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath DarkBoard.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > xcodebuild-export.log 2>&1 || true
          if ! grep -q "EXPORT SUCCEEDED" xcodebuild-export.log; then
            echo "::error::Export or upload failed again: see xcodebuild-export.log in the release. The archive stays in the release for another retry."
            exit 1
          fi
          echo "Uploaded to App Store Connect; TestFlight processes it next."

      # Uploaded: the kept archive has done its job, and a later retry must not send it twice.
      - name: Drop the kept archive
        env:
          GH_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: gh release delete-asset "$RELEASE_TAG" DarkBoard.xcarchive.zip --repo "$CLIENT_REPO" --yes

      - name: Revoke this run's development certificates
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          BEFORE="$RUNNER_TEMP/dev-certs-before.txt"
          if [ ! -f "$BEFORE" ] || [ ! -f "$KEY_DIR/asc-token.sh" ]; then
            echo "No certificate list from before the export: nothing revoked."
            exit 0
          fi
          TOKEN=$(bash "$KEY_DIR/asc-token.sh")
          if ! curl -sfg -H "Authorization: Bearer $TOKEN" \
              "https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=DEVELOPMENT,IOS_DEVELOPMENT&fields[certificates]=certificateType&limit=200" \
              | jq -r '.data[].id' | sort > "$RUNNER_TEMP/dev-certs-after.txt"; then
            echo "::warning::Could not list certificates; this run's development certificate was not revoked."
            exit 0
          fi
          NEW=$(comm -13 "$BEFORE" "$RUNNER_TEMP/dev-certs-after.txt")
          COUNT=$(printf '%s' "$NEW" | grep -c . || true)
          if [ "$COUNT" -gt 1 ]; then
            echo "::warning::$COUNT new development certificates since the export started; none revoked, check Certificates on developer.apple.com."
            exit 0
          fi
          REVOKED=0
          for ID in $NEW; do
            STATUS=$(curl -sg -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.appstoreconnect.apple.com/v1/certificates/$ID")
            if [ "$STATUS" = "204" ]; then
              REVOKED=$((REVOKED + 1))
            else
              echo "::warning::A development certificate could not be revoked (HTTP $STATUS)."
            fi
          done
          echo "Development certificates made by this run: $COUNT, revoked: $REVOKED"

      - name: Remove the key
        if: always()
        run: rm -rf "$KEY_DIR"

      - name: Upload the export log to the private release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          if [ -s xcodebuild-export.log ]; then
            gh release upload "$RELEASE_TAG" xcodebuild-export.log --repo "$CLIENT_REPO" --clobber \
              || echo "::warning::xcodebuild-export.log could not be uploaded."
          fi
