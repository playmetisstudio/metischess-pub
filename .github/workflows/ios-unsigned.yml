name: iOS Unsigned Build

# Compiles the Unity-exported Xcode project into an UNSIGNED .ipa on a macOS runner.
# No Apple Developer account is needed: signing is switched off. The .ipa is re-signed
# with a free Apple ID at install time (Sideloadly), which is enough for on-device
# validation (S17-01) but not for TestFlight / App Store.
#
# Fallback copy of metischess-client/.github/workflows/ios-unsigned.yml. The build normally runs
# there; use this one when that repository's Actions quota is used up (a macOS runner spends it
# ten times as fast), because Actions minutes are free in a public repository.
# Differences from the client copy: no dSYM (DEBUG_INFORMATION_FORMAT=dwarf) and no index store,
# which only serve crash symbolication and the Xcode editor, not a sideloaded test build.
# metischess-client/tools/ios-build/build-ipa.ps1 runs the Unity export, the upload, this workflow
# and the download in one command.
# Nothing from the game is published by it: the Xcode project is read from a release of the
# private repository and the .ipa and the build log are written back to that same release.
# The job log on this page is public, so it only says whether each step passed: the output of
# unzip, pod install and xcodebuild (stdout and stderr) goes to unzip.log, pod-install.log and
# xcodebuild.log in that release.
#
# One-time setup: a fine-grained personal access token limited to metischess-client with
# "Contents: Read and write", saved in this repository as the secret CLIENT_REPO_TOKEN.
#
# The Unity step runs locally on Windows (Unity -> iOS export), so this job only pays
# for the Xcode compile. Upload the export first:
#   1. Build target iOS in Unity, output builds/ios-xcode/
#   2. Zip the folder's contents to ios-xcode.zip
#   3. gh release upload ios-xcode-latest ios-xcode.zip --clobber   (in metischess-client)
#   4. gh workflow run ios-unsigned.yml --repo playmetisstudio/metischess-pub
#   5. gh release download ios-xcode-latest --pattern DarkBoard-unsigned.ipa   (in metischess-client)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release in metischess-client that holds ios-xcode.zip"
        required: true
        default: "ios-xcode-latest"

permissions: {}

env:
  CLIENT_REPO: playmetisstudio/metischess-client
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  build:
    name: Xcode build (unsigned, device)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Download Xcode project
        env:
          GH_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The secret CLIENT_REPO_TOKEN is not set (see the header of this workflow)."
            exit 1
          fi
          gh release download "$RELEASE_TAG" \
            --repo "$CLIENT_REPO" --pattern ios-xcode.zip
          # Remove the results of the previous run, so a failed build cannot leave an old .ipa
          # in the release that looks like the new one.
          ASSETS=$(gh release view "$RELEASE_TAG" --repo "$CLIENT_REPO" --json assets --jq '.assets[].name')
          for OLD in DarkBoard-unsigned.ipa unzip.log pod-install.log xcodebuild.log; do
            if grep -qxF "$OLD" <<< "$ASSETS"; then
              gh release delete-asset "$RELEASE_TAG" "$OLD" --repo "$CLIENT_REPO" --yes
            fi
          done
          if ! unzip -q ios-xcode.zip -d xcode > unzip.log 2>&1; then
            echo "::error::ios-xcode.zip could not be unpacked: see unzip.log in the release."
            exit 1
          fi

      # The runner's hardware, to compare build times with the runs in metischess-client.
      - name: Runner and Xcode version
        run: |
          echo "CPU: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) cores ($(sysctl -n hw.perflevel0.physicalcpu 2>/dev/null || echo '?') performance)"
          echo "RAM: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          xcodebuild -version

      # The Facebook SDK (ADR-0019) arrives as CocoaPods. The Windows export only writes the
      # Podfile (there is no `pod` on Windows), so the pods are resolved here.
      # The Podfile from EDM4U lists two spec sources: the CDN and the full git Specs repo. With
      # --repo-update the git one is cloned in full on every fresh runner (most of the 10-13 min
      # this step took). Every pod we use is on the CDN, so the git source is dropped here.
      - name: Drop the git Specs source from the Podfile
        working-directory: xcode
        run: |
          if [ -f Podfile ]; then
            sed -i '' "/source 'https:\/\/github.com\/CocoaPods\/Specs'/d" Podfile
            grep -n "^source" Podfile || true
          fi

      # Downloaded pods (Facebook, Google Mobile Ads, GoogleSignIn, UMP) and the CDN spec index,
      # kept between runs while the Podfile does not change. They are public SDKs, nothing of the
      # game: safe in the cache of a public repository.
      - name: Cache CocoaPods downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos/trunk
          key: pods-${{ runner.os }}-${{ hashFiles('xcode/Podfile') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        working-directory: xcode
        run: |
          if [ -f Podfile ]; then
            pod --version
            if pod install --repo-update > ../pod-install.log 2>&1; then
              echo "pod install succeeded"
            else
              echo "::error::pod install failed: see pod-install.log in the release."
              exit 1
            fi
          else
            echo "No Podfile in the export: building the bare Xcode project."
          fi

      - name: Build (signing off)
        working-directory: xcode
        run: |
          set -o pipefail
          if [ -d Unity-iPhone.xcworkspace ]; then
            CONTAINER=(-workspace Unity-iPhone.xcworkspace)
          else
            CONTAINER=(-project Unity-iPhone.xcodeproj)
          fi
          xcodebuild \
            "${CONTAINER[@]}" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee ../xcodebuild.log | grep -E "BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" ../xcodebuild.log; then
            echo "::error::Build failed: see xcodebuild.log in the release."
            exit 1
          fi

      - name: Package unsigned .ipa
        run: |
          mkdir Payload
          cp -R derived/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry DarkBoard-unsigned.ipa Payload
          ls -lh DarkBoard-unsigned.ipa

      # Artifacts of a public repository can be downloaded by any signed-in GitHub user, so the
      # .ipa and the full log go back to the private release instead of actions/upload-artifact.
      - name: Upload .ipa to the private release
        env:
          GH_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" DarkBoard-unsigned.ipa \
            --repo "$CLIENT_REPO" --clobber

      - name: Upload build logs to the private release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          for LOG in unzip.log pod-install.log xcodebuild.log; do
            # -s: a release does not accept an empty file (unzip.log is empty when unzip is clean).
            if [ -s "$LOG" ]; then
              gh release upload "$RELEASE_TAG" "$LOG" --repo "$CLIENT_REPO" --clobber \
                || echo "::warning::$LOG could not be uploaded."
            fi
          done
